name: Windows-EXE bauen

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release mit diesem Tag veröffentlichen (z. B. v1.5.1) – leer lassen für nur bauen"
        required: false
        default: ""
      prerelease:
        description: "Als Testversion (Pre-Release) veröffentlichen – erscheint nicht im Update-Hinweis"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Tests
        run: python -m pytest -q

      - name: Symbol und Versionsinfo erzeugen
        run: |
          python -m fm27facegen.icon build/icon.ico
          python tools/version_info.py build/version.txt

      # Programmordner statt Einzeldatei: startet viel schneller (nichts wird bei jedem Start entpackt)
      - name: EXE bauen
        run: python -m PyInstaller --noconfirm --onedir --windowed --name FM27-FaceGenerator --icon build/icon.ico --version-file build/version.txt --collect-data cv2 --collect-all tkinterdnd2 --collect-all send2trash run.py

      - name: Selbsttest der EXE
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\FM27-FaceGenerator\FM27-FaceGenerator.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Selbsttest fehlgeschlagen (Exit-Code $($p.ExitCode))" }
          Write-Host "Selbsttest OK"

      - name: Paket zusammenstellen
        shell: pwsh
        run: |
          $dir = "pkg\FM27 Face Generator"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item -Recurse dist\FM27-FaceGenerator\* $dir
          Copy-Item README.md, LIESMICH.md, PatchNotes.txt, PatchNotes_DE.txt, laender.beispiel.json $dir
          Compress-Archive -Path pkg\* -DestinationPath FM27-FaceGenerator-win.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FM27-FaceGenerator-windows
          path: pkg/

      - name: Release veröffentlichen (bei Tags v* oder manuell mit release_tag)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: FM27 Face Generator ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease == true }}
          body: |
            Windows-Programm zum Erzeugen realistischer Spielergesichter (250 × 250 px, PNG) für Football Manager 27.

            **Download:** `FM27-FaceGenerator-win.zip` unten herunterladen, entpacken, im Ordner „FM27 Face Generator“ die `FM27-FaceGenerator.exe` starten.
            Die ausführliche Anleitung (Installation, FM-Import, lokales Stable Diffusion) steht in der enthaltenen LIESMICH.md (Deutsch) bzw. README.md (English).

            Windows app that creates realistic player faces (250 × 250 px, PNG) for Football Manager 27.
            Download `FM27-FaceGenerator-win.zip` below, extract it and run `FM27-FaceGenerator.exe` in the "FM27 Face Generator" folder. Full guide: README.md.
            Languages: 20 (all FM27 languages except Arabic) – translations except German are AI-generated.
          files: FM27-FaceGenerator-win.zip

      # Gab es den Tag schon als Testversion, ändert die Aktion oben den Status nicht – hier ausdrücklich
      # zur offiziellen (neuesten) Version machen.
      - name: Als offizielle Version markieren
        if: inputs.release_tag != '' && inputs.prerelease == false
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ inputs.release_tag }}" --repo "${{ github.repository }}" --prerelease=false --latest
